[project]
name = "science-game"
version = "0.0.1"
description = "Algorithm Forge — LLM-driven evolutionary code/model search with research dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "beko2210" }]
keywords = ["evolution", "neuroevolution", "llm", "alphaevolve", "openevolve"]

dependencies = [
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
  "numpy>=1.26",
  "huggingface-hub>=0.24",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.36",
  "plotly>=5.22",
  "pandas>=2.2",
]
nas = [
  "torch>=2.3",
  "torchvision>=0.18",
]
api-llm = [
  "anthropic>=0.34",
  "openai>=1.40",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
science-game = "science_game.cli:app"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/science_game"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
